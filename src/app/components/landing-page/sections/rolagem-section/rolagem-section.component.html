<section class="rolagem-section">
  <div class="section-container">
    <h2>Rolagem de Posições</h2>
    <p class="section-intro">Aprenda sobre estratégias de rolagem para otimizar suas posições em opções</p>

    <div class="cards-grid">
      <article class="card" *ngFor="let card of cards">
        <div class="card-icon">{{ card.icone }}</div>
        <h3>{{ card.titulo }}</h3>
        <p>{{ card.descricao }}</p>
      </article>
    </div>
  </div>
</section>
