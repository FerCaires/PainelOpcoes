<app-header-menu></app-header-menu>

<div class="criar-carteira-container">
  <mat-card class="card">
    <mat-card-header>
      <mat-card-title>Criar Nova Carteira</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <form [formGroup]="form" (ngSubmit)="criar()">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Nome da Carteira</mat-label>
          <input matInput formControlName="nome" placeholder="Ex: MinhaCarteira123" />
          <mat-error *ngIf="nomeControl.hasError('required')">
            Nome é obrigatório
          </mat-error>
          <mat-error *ngIf="nomeControl.hasError('minlength')">
            Nome deve ter no mínimo 5 caracteres
          </mat-error>
          <mat-error *ngIf="nomeControl.hasError('maxlength')">
            Nome deve ter no máximo 20 caracteres
          </mat-error>
          <mat-error *ngIf="nomeControl.hasError('pattern')">
            Nome deve conter apenas letras e números
          </mat-error>
        </mat-form-field>

        <div *ngIf="erro" class="error-message">
          {{ erro }}
        </div>

        <button
          mat-raised-button
          color="primary"
          type="submit"
          [disabled]="!podeCriar"
          class="full-width">
          <span *ngIf="!carregando">Criar Carteira</span>
          <span *ngIf="carregando">Criando...</span>
        </button>
      </form>
    </mat-card-content>
  </mat-card>
</div>
