version: '3.8'

services:
  painel-opcoes:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: painel-opcoes-app
    ports:
      - "80:80"
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/index.html"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - painel-network
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    labels:
      - "com.example.description=Painel de Rolagem de Opções"
      - "com.example.version=1.0.0"

networks:
  painel-network:
    driver: bridge
